name: Playwright tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          QAU_ADMIN_EMAIL: ${{ secrets.QAU_ADMIN_EMAIL }}
          QAU_ADMIN_PASSWORD: ${{ secrets.QAU_ADMIN_PASSWORD }}
          QAU_JWT_SECRET: ${{ secrets.QAU_JWT_SECRET }}
          QAU_CLIENT_ORIGIN: ${{ secrets.QAU_CLIENT_ORIGIN }}
          QAU_PUBLIC_API_URL: ${{ secrets.QAU_PUBLIC_API_URL }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
